services:
  # Backend Web Service (Dockerized Laravel API)
  - type: web
    name: supremogen-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "placeholder-replace-with-your-key"
      - key: APP_URL
        value: "https://supremogen-backend.onrender.com"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-crimson-sunset-atkit30f-pooler.c-9.us-east-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false  # Set manually in Render dashboard for security
      - key: DB_SSLMODE
        value: require
      - key: FRONTEND_URL
        value: "https://your-app.vercel.app"
      - key: SESSION_DRIVER
        value: cookie
      - key: QUEUE_CONNECTION
        value: database

