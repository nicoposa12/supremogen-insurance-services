services:
  # Backend Web Service (Dockerized Laravel API)
  - type: web
    name: supremogen-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "placeholder-replace-with-your-key" # Override this in the Render dashboard with base64 key
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: supremogen-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: supremogen-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: supremogen-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: supremogen-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: supremogen-db
          property: password

databases:
  # Managed PostgreSQL Database
  - name: supremogen-db
    databaseName: supremogen_db
    user: supremogen_user
    plan: free

