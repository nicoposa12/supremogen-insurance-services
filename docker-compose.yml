services:
  # PostgreSQL Database Container (matches Neon production)
  db:
    image: postgres:16-alpine
    container_name: supremogen_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: supremogen_db
      POSTGRES_USER: supremogen_user
      POSTGRES_PASSWORD: passroot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - supremogen-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U supremogen_user -d supremogen_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - Database Management UI (replaces phpMyAdmin)
  pgadmin:
    image: dpage/pgadmin4
    container_name: supremogen_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@supremogen.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    networks:
      - supremogen-network

  # Laravel API Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: supremogen_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      # Don't bind-mount container's composer cache
      - /var/www/html/vendor
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - PHP_CLI_SERVER_WORKERS=10
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=supremogen_db
      - DB_USERNAME=supremogen_user
      - DB_PASSWORD=passroot
      - DB_SSLMODE=disable
    networks:
      - supremogen-network

  # React SPA Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: supremogen_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # Cache inside container to prevent OS package mismatches
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_PROXY_URL=http://backend:8000
    networks:
      - supremogen-network

networks:
  supremogen-network:
    driver: bridge

volumes:
  postgres_data:

